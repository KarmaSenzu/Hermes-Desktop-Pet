name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
      - 'integration/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test & Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'avatar/package-lock.json'

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libopenjp2-7 fakeroot dpkg

      - name: Install Dependencies
        working-directory: avatar
        run: npm ci || npm install

      - name: Run Tests (Vitest)
        working-directory: avatar
        run: npm test

      - name: Run Application Build (electron-vite)
        working-directory: avatar
        run: npm run build

      - name: Run Diagnostic Healthcheck
        working-directory: avatar
        run: npm run doctor

      - name: Audit Production Dependencies
        working-directory: avatar
        run: npm audit --omit=dev || true
