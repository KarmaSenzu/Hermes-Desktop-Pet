name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libopenjp2-7 fakeroot dpkg

      - name: Install Dependencies
        working-directory: avatar
        run: npm ci || npm install

      - name: Run Diagnostic Healthcheck
        working-directory: avatar
        run: npm run doctor

      - name: Build Application Bundle
        working-directory: avatar
        run: npm run build

      - name: Package Windows Executable
        if: runner.os == 'Windows'
        working-directory: avatar
        run: npx --yes electron-builder --win --publish never

      - name: Build Lightweight OTA Code Patch
        if: runner.os == 'Windows'
        working-directory: avatar
        run: npm run build:patch

      - name: Package macOS Executable
        if: runner.os == 'macOS'
        working-directory: avatar
        run: npx --yes electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package Linux Executable
        if: runner.os == 'Linux'
        working-directory: avatar
        run: npx --yes electron-builder --linux --publish never

      - name: Generate SHA-256 Checksums
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: avatar/dist
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const exts = ['.exe', '.dmg', '.AppImage', '.deb', '.tar.gz', '.zip'];
            const files = fs.readdirSync('.').filter((f) => exts.some((e) => f.endsWith(e))).sort();
            const lines = files.map((f) => {
              const hash = crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
              return hash + '  ' + f;
            });
            fs.writeFileSync('SHA256SUMS-${{ runner.os }}.txt', lines.join('\n') + '\n');
            console.log(lines.join('\n'));
          "

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Hermes Desktop Pet ${{ github.ref_name }}
          generate_release_notes: ${{ runner.os == 'Windows' }}
          fail_on_unmatched_files: false
          files: |
            avatar/dist/*.exe
            avatar/dist/*.dmg
            avatar/dist/*.AppImage
            avatar/dist/*.deb
            avatar/dist/*.tar.gz
            avatar/dist/*.zip
            avatar/dist/SHA256SUMS-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize-checksums:
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Append Clean Categorized Download Guide & SHA-256 Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p /tmp/checksums
          gh release download "$TAG_NAME" -R "$REPO" -p "SHA256SUMS-*.txt" -D /tmp/checksums || true
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");
            const path = require("path");

            const tag = process.env.TAG_NAME;
            const repo = process.env.REPO;
            const ver = tag.replace(/^v/i, "");

            let rawBody = "";
            try {
              rawBody = execSync(`gh release view "${tag}" -R "${repo}" --json body -q .body`, { encoding: "utf8" });
            } catch (e) {
              rawBody = "";
            }

            // Bersihkan semua duplikasi blok panduan unduhan dan checksum lama jika ada
            let cleanBody = rawBody
              .replace(/### Panduan Pilih File Unduhan Sesuai Perangkat[\s\S]*?(?:---\n?|$)/g, "")
              .replace(/### Checksums \(SHA-256\)[\s\S]*?(?:```\n?|$)/g, "")
              .trim();

            const rows = [
              "| Sistem Operasi | Kegunaan | File yang Diunduh |",
              "| :--- | :--- | :--- |",
              `| **Windows 10 / 11 (64-bit)** | Installer Setup (Disarankan) | \\\`WINDOWS-Installer-Hermes-Desktop-Pet-v${ver}-x64.exe\\\` |`,
              `| **Windows 10 / 11 (64-bit)** | Versi Portabel (Ekstrak & Jalankan) | \\\`WINDOWS-Portable-Hermes-Desktop-Pet-v${ver}-x64.zip\\\` |`,
              `| **macOS Apple Silicon (M1/M2/M3/M4)** | Installer DMG (Disarankan) | \\\`MACOS-M-Series-Hermes-Desktop-Pet-v${ver}-arm64.dmg\\\` |`,
              `| **macOS Apple Silicon (M1/M2/M3/M4)** | Arsip Aplikasi (.app) | \\\`MACOS-M-Series-Hermes-Desktop-Pet-v${ver}-arm64.zip\\\` |`,
              `| **Linux (x86_64)** | AppImage Universal (Klik 2x / chmod +x) | \\\`LINUX-Hermes-Desktop-Pet-v${ver}-x86_64.AppImage\\\` |`,
              `| **Linux (x86_64)** | Arsip Portabel (.tar.gz) | \\\`LINUX-Hermes-Desktop-Pet-v${ver}-x86_64.tar.gz\\\` |`,
              `| **Pembaruan Ringan (OTA)** | Patch internal otomatis aplikasi | \\\`OTA-Patch-Hermes-Desktop-Pet-v${ver}.zip\\\` |`
            ].join("\n");
            const guide = `### Panduan Pilih File Unduhan Sesuai Perangkat\n\n${rows}\n\n---`;

            let checksumSection = "";
            const checkDir = "/tmp/checksums";
            if (fs.existsSync(checkDir)) {
              const files = fs.readdirSync(checkDir).filter(f => f.startsWith("SHA256SUMS-"));
              const allLines = new Set();
              for (const f of files) {
                const content = fs.readFileSync(path.join(checkDir, f), "utf8");
                content.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => allLines.add(l));
              }
              if (allLines.size > 0) {
                checksumSection = `### Checksums (SHA-256)\n\`\`\`\n${Array.from(allLines).sort().join("\n")}\n\`\`\``;
              }
            }

            const sections = [guide, cleanBody, checksumSection].filter(Boolean);
            const finalBody = sections.join("\n\n");
            fs.writeFileSync("/tmp/final_notes.md", finalBody, "utf8");
          '
          gh release edit "$TAG_NAME" -R "$REPO" --notes-file /tmp/final_notes.md
