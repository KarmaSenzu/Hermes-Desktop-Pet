name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Install Dependencies
        working-directory: avatar
        run: npm ci || npm install

      - name: Run Diagnostic Healthcheck
        working-directory: avatar
        run: npm run doctor

      - name: Build Application Bundle
        working-directory: avatar
        run: npm run build

      - name: Package Windows Executable
        if: runner.os == 'Windows'
        working-directory: avatar
        run: npx --yes electron-builder --win --publish never

      - name: Package macOS Executable
        if: runner.os == 'macOS'
        working-directory: avatar
        run: npx --yes electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package Linux Executable
        if: runner.os == 'Linux'
        working-directory: avatar
        run: npx --yes electron-builder --linux AppImage deb --publish never

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Hermes Desktop Pet ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            avatar/dist/*.exe
            avatar/dist/*.dmg
            avatar/dist/*.AppImage
            avatar/dist/*.deb
            avatar/dist/*.tar.gz
            avatar/dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
