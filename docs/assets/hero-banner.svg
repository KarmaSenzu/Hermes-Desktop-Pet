<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hermes Desktop Pet Banner">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#0a101d" />
    </linearGradient>
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-indigo" cx="80%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-amber" cx="52%" cy="15%" r="35%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Canvas & Ambient Glows -->
  <rect width="1200" height="380" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="380" rx="20" fill="url(#grid)" />
  <rect width="1200" height="380" rx="20" fill="url(#glow-cyan)" />
  <rect width="1200" height="380" rx="20" fill="url(#glow-indigo)" />
  <rect width="1200" height="380" rx="20" fill="url(#glow-amber)" />
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Left Decorative Emblem -->
  <g transform="translate(120, 180)">
    <circle cx="0" cy="0" r="68" fill="#0f172a" fill-opacity="0.85" stroke="url(#ring-grad)" stroke-width="3" />
    <circle cx="0" cy="0" r="56" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6 4" />
    <!-- Stylized Caduceus / Wings + AI Core -->
    <path d="M -34 -8 C -24 -28, -8 -24, 0 -10 C 8 -24, 24 -28, 34 -8 C 22 -4, 14 2, 0 8 C -14 2, -22 -4, -34 -8 Z" fill="url(#ring-grad)" fill-opacity="0.9" />
    <circle cx="0" cy="-24" r="10" fill="#38bdf8" />
    <path d="M 0 -14 L 0 32" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <path d="M -14 8 C -6 18, 6 18, 14 8" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M -10 22 C -4 29, 4 29, 10 22" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Status dot -->
    <circle cx="48" cy="48" r="9" fill="#070b14" />
    <circle cx="48" cy="48" r="6" fill="#22c55e" />
  </g>

  <!-- Main Copy -->
  <g transform="translate(226, 98)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="-34" width="276" height="24" rx="12" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="14" cy="-22" r="4" fill="#38bdf8" />
    <text x="26" y="-18" fill="#7dd3fc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">DESKTOP PET AI COMPANION · v0.1.4</text>

    <!-- Main Heading -->
    <text x="0" y="34" fill="url(#title-grad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="800" letter-spacing="-0.8">HERMES DESKTOP PET</text>

    <!-- Subtitle -->
    <text x="0" y="72" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Pendamping AI Otonom Live2D &amp; 3D WebGL di Atas Layar Kerja Anda
    </text>

    <!-- Architecture Line -->
    <text x="0" y="106" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="13">
      Hermes Brain (:9119 JSON-RPC)  ⇄  Electron WebGL Actor  ⇄  Snip Vision · Kokoro-TTS · 9Router
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 134)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      <rect x="0" y="0" width="118" height="28" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" />
      <text x="59" y="18" text-anchor="middle" fill="#e0f2fe">Live2D &amp; VRM</text>

      <rect x="128" y="0" width="134" height="28" rx="8" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" />
      <text x="195" y="18" text-anchor="middle" fill="#e0e7ff">Screen Vision Snip</text>

      <rect x="272" y="0" width="142" height="28" rx="8" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" />
      <text x="343" y="18" text-anchor="middle" fill="#d1fae5">OAuth &amp; 9Router</text>

      <rect x="424" y="0" width="136" height="28" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" />
      <text x="492" y="18" text-anchor="middle" fill="#fef3c7">Kokoro &amp; Edge TTS</text>

      <rect x="570" y="0" width="128" height="28" rx="8" fill="#1e293b" stroke="#f472b6" stroke-opacity="0.4" />
      <text x="634" y="18" text-anchor="middle" fill="#fce7f3">Hardened IPC</text>
    </g>
  </g>

  <!-- Right Side Visual Widget Card -->
  <g transform="translate(948, 62)">
    <rect x="0" y="0" width="212" height="256" rx="16" fill="#0f172a" fill-opacity="0.9" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
    <!-- Header dots -->
    <circle cx="18" cy="18" r="4.5" fill="#ef4444" />
    <circle cx="33" cy="18" r="4.5" fill="#f59e0b" />
    <circle cx="48" cy="18" r="4.5" fill="#22c55e" />
    <text x="196" y="22" text-anchor="end" fill="#64748b" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">STATUS TELEMETRY</text>
    <line x1="14" y1="34" x2="198" y2="34" stroke="#ffffff" stroke-opacity="0.08" />

    <!-- Rows -->
    <g transform="translate(16, 52)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
      <text x="0" y="0" fill="#94a3b8" font-size="10.5" font-weight="600">HERMES GATEWAY (:9119)</text>
      <rect x="0" y="8" width="180" height="22" rx="6" fill="#1e293b" />
      <circle cx="12" cy="19" r="4" fill="#22c55e" />
      <text x="24" y="23" fill="#e2e8f0" font-size="11" font-weight="600">Connected · JSON-RPC 2.0</text>

      <text x="0" y="52" fill="#94a3b8" font-size="10.5" font-weight="600">MULTI-ACCOUNT QUOTA</text>
      <rect x="0" y="60" width="180" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="60" width="144" height="8" rx="4" fill="#38bdf8" />
      <text x="0" y="82" fill="#7dd3fc" font-size="10">Gemini · OpenRouter · 9Router</text>

      <text x="0" y="108" fill="#94a3b8" font-size="10.5" font-weight="600">AUDIO &amp; VOICE ENGINE</text>
      <rect x="0" y="116" width="180" height="22" rx="6" fill="#1e293b" />
      <text x="10" y="131" fill="#fde68a" font-size="11" font-weight="600">Kokoro ONNX + Lip-Sync</text>

      <text x="0" y="162" fill="#94a3b8" font-size="10.5" font-weight="600">SECURITY &amp; TEST SUITE</text>
      <rect x="0" y="170" width="180" height="22" rx="6" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.4" />
      <text x="90" y="185" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700">124 / 124 Tests Passed</text>
    </g>
  </g>
</svg>
