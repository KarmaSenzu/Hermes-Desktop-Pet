<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Avatar</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <!-- Kontainer three.js (canvas dibuat dinamis) -->
    <div id="app" class="stage"></div>

    <!-- Bubble status di atas avatar (thinking/processing/speaking/idle) -->
    <div id="status-bubble" class="status-bubble" hidden></div>

    <!-- Area drag untuk memindahkan window (karena frameless) -->
    <div id="drag-handle" class="drag-handle" title="Seret untuk memindahkan"></div>

    <!-- Ikon komentar (trigger buka/tutup bottom sheet) -->
    <button id="comment-toggle" class="comment-toggle" title="Buka chat">💬</button>

    <!-- Tombol emote (buka menu) -->
    <button id="emote-toggle" class="emote-btn" title="Emote">😀</button>

    <!-- Panel emote -->
    <div id="emote-panel" class="emote-panel" hidden>
      <button class="emote-item" data-emote="bounce" data-icon="arrow-up">Bounce</button>
      <button class="emote-item" data-emote="jump" data-icon="arrow-up">Jump</button>
      <button class="emote-item" data-emote="wave" data-icon="hand">Wave</button>
      <button class="emote-item" data-emote="nod" data-icon="smile">Nod</button>
    </div>

    <!-- Tombol kembali ke pengaturan -->
    <button id="settings-btn" class="emote-btn settings-btn" title="Pengaturan">⚙️</button>

    <!-- Backdrop (klik luar untuk menutup panel) -->
    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>

    <!-- Bottom sheet / chat drawer -->
    <div id="chat" class="chat">
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Ketik pesan..." autocomplete="off" />
        <button type="submit">Kirim</button>
        <button type="button" id="mic-btn" title="Rekam suara">🎤</button>
      </form>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
